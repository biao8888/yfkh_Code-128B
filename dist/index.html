<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云服卡航 · 运单条码生成器</title>
  <script src="jsbarcode.all.min.js"></script>
  <style>
    :root{--ink:#16233b;--muted:#6c7890;--line:#dbe2ec;--blue:#246bfe;--bg:#f5f7fb;--paper:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
    .app{height:100vh;display:grid;grid-template-columns:360px 1fr;gap:28px;padding:34px;max-width:1500px;margin:auto;overflow:hidden}
    .sidebar{display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--ink);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 8px 20px #16233b22}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #1b2d4b0a}.panel h2{font-size:16px;margin:0 0 6px}.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 16px}
    .sidebar .panel:first-of-type{flex:1;display:flex;flex-direction:column}.sidebar .panel:first-of-type textarea{flex:1;min-height:0}
    textarea{width:100%;min-height:380px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.5;color:var(--ink);outline:none;transition:.2s;background:#fbfcfe}textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px #246bfe14}
    .actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 15px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}.btn.primary{background:var(--blue);color:#fff;flex:1}.btn.primary:hover{background:#1559e4}.btn.ghost{background:#eef3fb;color:var(--ink)}.btn.ghost:hover{background:#e3ebf8}
    .stats{display:flex;justify-content:space-between;padding-top:15px;margin-top:15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.stats strong{color:var(--ink);font-size:16px}
    .preview-wrap{min-width:0;min-height:0;display:flex;flex-direction:column}.preview-head{width:min(100%,794px);display:flex;justify-content:flex-start;align-items:end;gap:28px;margin:3px auto 16px}.preview-head h2{margin:0;font-size:20px}.preview-head p{margin:5px 0 0;font-size:12px;color:var(--muted)}.paper{background:var(--paper);width:min(100%,794px);min-height:0;flex:1;overflow-y:auto;margin:0 auto;padding:48px 52px;border-radius:5px;box-shadow:0 14px 45px #1b2d4b14}.paper-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px}.paper-top h3{margin:0;font-size:20px}.paper-top span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #cfd7e4;border-radius:7px;padding:11px 7px 9px;text-align:center;break-inside:avoid;background:#fff}.card .index{font-size:9px;color:var(--muted);text-align:left;margin-bottom:6px}.card svg{width:100%;height:auto;max-height:58px}.card .value{font:700 12px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.15px;margin-top:5px;overflow-wrap:anywhere}.empty{grid-column:1/-1;text-align:center;padding:130px 20px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px}.footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:24px}
    @media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;padding:20px;overflow:visible}.paper{min-height:auto;flex:none;padding:30px 22px}.sidebar{order:0}.sidebar .panel:first-of-type textarea{min-height:380px}.grid{grid-template-columns:repeat(3,1fr);gap:8px}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media print{body{background:#fff}.app{display:block;padding:0}.sidebar,.preview-head,.footer-note{display:none}.paper{box-shadow:none;width:210mm;min-height:297mm;padding:10mm;border-radius:0;margin:0}.grid{gap:3mm}.card{padding:3mm 2mm}.card svg{max-height:18mm}.card .value{font-size:10px}.paper-top{margin-bottom:5mm}}
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">条</div><div><h1>云服卡航 · 运单条码</h1><p>Code 128B 生成器</p></div></div>
      <section class="panel">
        <h2>输入单号</h2>
        <textarea id="input" placeholder="一行对应一个条码，系统会自动追加固定后缀 -1&#10;例如：16541550 → 16541550-1&#10;&#10;请在这里输入单号，每行一个"></textarea>
        <div class="actions"><button class="btn primary" id="generate">生成预览</button><button class="btn ghost" id="clear">清空</button></div>
        <div class="stats"><span>已识别条码</span><strong id="count">0</strong></div>
      </section>
    </aside>
    <section class="preview-wrap">
      <div class="preview-head"><div><h2>预览效果</h2></div><button class="btn primary" id="print" style="flex:0 0 auto">打印 A4</button></div>
      <div class="paper" id="paper"><div class="paper-top"><h3>云服卡航运单</h3><span id="date"></span></div><div class="grid" id="grid"><div class="empty">输入单号后点击“生成预览”</div></div><div class="footer-note">Code 128B · 请勿缩放条码</div></div>
    </section>
  </main>
  <script>
    const input=document.getElementById('input'),grid=document.getElementById('grid'),count=document.getElementById('count');
    document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium'}).format(new Date());
    function generate(){const values=input.value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);count.textContent=values.length;grid.innerHTML='';if(!values.length){grid.innerHTML='<div class="empty">输入单号后点击“生成预览”</div>';return}values.forEach((raw,i)=>{const value=`${raw}-1`,card=document.createElement('article');card.className='card';card.innerHTML=`<div class="index">NO. ${String(i+1).padStart(2,'0')}</div><svg></svg><div class="value">${value}</div>`;grid.appendChild(card);JsBarcode(card.querySelector('svg'),value,{format:'CODE128B',displayValue:false,height:52,width:1.35,margin:0,background:'#ffffff',lineColor:'#16233b'});});}
    document.getElementById('generate').addEventListener('click',generate);document.getElementById('clear').addEventListener('click',()=>{input.value='';generate();input.focus()});document.getElementById('print').addEventListener('click',()=>{if(!input.value.trim())generate();window.print()});input.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')generate()});
  </script>
</body>
</html>
